apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bugboard
  namespace: argocd
spec:
  project: default

  source:
    # Replace with your actual GitHub repository URL
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/bugboard.git
    targetRevision: main
    path: k8s     # Folder containing deployment.yaml and service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true       # Remove resources that are no longer in Git
      selfHeal: true    # Revert manual changes made directly to the cluster
    syncOptions:
      - CreateNamespace=true
